<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARA 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00FFD9', secondary: '#9DF654', accent: '#75CFFF',
                        dark: '#151617', 'dark-light': '#1E1F21', 'dark-lighter': '#33353A',
                    }
                }
            }
        }
    </script>
    <style>
        .bg-glass { background: rgba(43,45,47,0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-dark text-white min-h-screen">

    <!-- 登录页 -->
    <div id="login-page" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-glass rounded-2xl p-10 w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold mb-2">PARA</h1>
                <p class="text-gray-400">管理后台</p>
            </div>
            <div id="login-error" class="hidden mb-4 p-3 bg-red-500 bg-opacity-20 border border-red-500 rounded-lg text-red-400 text-sm"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">用户名</label>
                    <input type="text" id="login-username" required placeholder="请输入用户名"
                        class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-colors">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">密码</label>
                    <input type="password" id="login-password" required placeholder="请输入密码"
                        class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-colors">
                </div>
                <button type="submit" id="login-btn"
                    class="w-full py-3 bg-primary text-dark font-bold rounded-full hover:bg-opacity-80 transition-all">
                    登录
                </button>
            </form>
            <div class="text-center mt-6">
                <a href="index.html" class="text-gray-500 hover:text-gray-400 text-sm">← 返回前台</a>
            </div>
        </div>
    </div>

    <!-- 管理页面 -->
    <div id="admin-page" class="hidden">
        <!-- 顶部导航 -->
        <nav class="bg-dark-light border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-xl font-bold">PARA 管理后台</h1>
            <div class="flex items-center gap-4">
                <a href="index.html" target="_blank" class="text-gray-400 hover:text-primary text-sm transition-colors">
                    <i class="fa fa-external-link mr-1"></i>查看前台
                </a>
                <button id="logout-btn" class="text-gray-400 hover:text-white text-sm transition-colors">
                    <i class="fa fa-sign-out mr-1"></i>退出
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-8">
            <!-- Tab 切换 -->
            <div class="flex gap-4 mb-8 border-b border-gray-800">
                <button class="admin-tab pb-4 px-2 font-bold text-primary border-b-2 border-primary" data-tab="music">
                    <i class="fa fa-music mr-2"></i>好音乐审核
                    <span id="pending-count" class="ml-2 px-2 py-0.5 bg-primary text-dark text-xs rounded-full">0</span>
                </button>
                <button class="admin-tab pb-4 px-2 text-gray-400 hover:text-white transition-colors" data-tab="products">
                    <i class="fa fa-shopping-bag mr-2"></i>好周边管理
                </button>
            </div>

            <!-- 好音乐审核 -->
            <div id="tab-music" class="admin-content">
                <!-- 筛选 -->
                <div class="flex gap-3 mb-6">
                    <button class="music-filter px-4 py-2 rounded-full bg-primary text-dark font-bold text-sm" data-status="pending">待审核</button>
                    <button class="music-filter px-4 py-2 rounded-full bg-dark-lighter text-white text-sm hover:bg-gray-700" data-status="approved">已发布</button>
                    <button class="music-filter px-4 py-2 rounded-full bg-dark-lighter text-white text-sm hover:bg-gray-700" data-status="rejected">已拒绝</button>
                </div>
                <div id="music-list" class="space-y-4">
                    <div class="text-center py-8 text-gray-400"><i class="fa fa-spinner fa-spin text-2xl"></i></div>
                </div>
            </div>

            <!-- 好周边管理 -->
            <div id="tab-products" class="admin-content hidden">
                <!-- 添加商品表单 -->
                <div class="bg-dark-light rounded-2xl p-6 mb-8 border border-gray-800">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                        <i class="fa fa-plus-circle text-primary"></i> 添加商品
                    </h3>
                    <div id="product-add-success" class="hidden mb-4 p-3 bg-primary bg-opacity-20 border border-primary rounded-lg text-primary text-sm">商品已添加！</div>
                    <div id="product-add-error" class="hidden mb-4 p-3 bg-red-500 bg-opacity-20 border border-red-500 rounded-lg text-red-400 text-sm"></div>
                    <form id="add-product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">商品名称 *</label>
                            <input type="text" id="p-name" required placeholder="商品名称"
                                class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">价格</label>
                            <input type="number" id="p-price" step="0.01" placeholder="如：199.00"
                                class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">购买链接 * (淘宝/1688)</label>
                            <input type="url" id="p-link" required placeholder="https://..."
                                class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">店铺类型 *</label>
                            <select id="p-shop-type" required
                                class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                                <option value="taobao">淘宝</option>
                                <option value="1688">1688</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm text-gray-400 mb-1">图片链接</label>
                            <input type="url" id="p-image" placeholder="https://... (商品图片地址)"
                                class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-primary">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm text-gray-400 mb-1">商品描述</label>
                            <textarea id="p-desc" rows="2" placeholder="简短描述..."
                                class="w-full bg-dark-lighter border border-gray-700 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-primary resize-none"></textarea>
                        </div>
                        <div class="md:col-span-2">
                            <button type="submit" id="add-product-btn"
                                class="px-8 py-3 bg-primary text-dark font-bold rounded-full hover:bg-opacity-80 transition-all">
                                <i class="fa fa-plus mr-2"></i>添加商品
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 商品列表 -->
                <h3 class="font-bold text-lg mb-4">当前商品</h3>
                <div id="products-admin-list" class="space-y-4">
                    <div class="text-center py-8 text-gray-400"><i class="fa fa-spinner fa-spin text-2xl"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://lpncumrthrbzritjutxr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwbmN1bXJ0aHJienJpdGp1dHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzg1NjEsImV4cCI6MjA5MzcxNDU2MX0.yH4s9HESL5sVjdeEZ6kJPq8uvIHtZsMS8rVcpKFHD1Q';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLoggedIn = false;
    let currentMusicFilter = 'pending';

    // ===== 登录 =====
    // 简单前端密码验证（后台管理用）
    const ADMIN_USER = 'para_admin';
    const ADMIN_PASS = 'para2024';

    // 检查已登录
    if (sessionStorage.getItem('para_admin_logged') === 'true') {
        showAdmin();
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error');
        errEl.classList.add('hidden');

        if (username === ADMIN_USER && password === ADMIN_PASS) {
            sessionStorage.setItem('para_admin_logged', 'true');
            showAdmin();
        } else {
            errEl.textContent = '用户名或密码错误';
            errEl.classList.remove('hidden');
        }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
        sessionStorage.removeItem('para_admin_logged');
        document.getElementById('admin-page').classList.add('hidden');
        document.getElementById('login-page').classList.remove('hidden');
    });

    function showAdmin() {
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('admin-page').classList.remove('hidden');
        loadMusicList('pending');
        loadAdminProducts();
    }

    // ===== Tab 切换 =====
    document.querySelectorAll('.admin-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.admin-tab').forEach(t => {
                t.classList.remove('text-primary', 'border-b-2', 'border-primary');
                t.classList.add('text-gray-400');
            });
            this.classList.add('text-primary', 'border-b-2', 'border-primary');
            this.classList.remove('text-gray-400');
            document.querySelectorAll('.admin-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('tab-' + this.dataset.tab).classList.remove('hidden');
        });
    });

    // ===== 音乐筛选 =====
    document.querySelectorAll('.music-filter').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.music-filter').forEach(b => {
                b.classList.remove('bg-primary', 'text-dark', 'font-bold');
                b.classList.add('bg-dark-lighter', 'text-white');
            });
            this.classList.add('bg-primary', 'text-dark', 'font-bold');
            this.classList.remove('bg-dark-lighter', 'text-white');
            currentMusicFilter = this.dataset.status;
            loadMusicList(currentMusicFilter);
        });
    });

    // ===== 加载音乐列表 =====
    async function loadMusicList(status) {
        const list = document.getElementById('music-list');
        list.innerHTML = '<div class="text-center py-8 text-gray-400"><i class="fa fa-spinner fa-spin text-2xl"></i></div>';

        // 需要绕过 RLS 查询所有状态（使用 service role 或放开策略）
        // 这里用管理员模式查询 - 需要额外配置
        const { data, error } = await db
            .from('music_submissions')
            .select('*')
            .eq('status', status)
            .order('created_at', { ascending: false });

        if (error) {
            list.innerHTML = `<div class="text-center py-8 text-red-400">加载失败：${error.message}</div>`;
            return;
        }

        // 更新待审核数量
        if (status === 'pending') {
            document.getElementById('pending-count').textContent = data ? data.length : 0;
        }

        if (!data || data.length === 0) {
            list.innerHTML = '<div class="text-center py-8 text-gray-400">暂无数据</div>';
            return;
        }

        list.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bg-dark-light rounded-xl p-6 border border-gray-800 flex flex-col md:flex-row md:items-center gap-4';
            const statusBadge = {
                pending: '<span class="px-2 py-1 bg-yellow-500 bg-opacity-20 text-yellow-400 text-xs rounded-full">待审核</span>',
                approved: '<span class="px-2 py-1 bg-green-500 bg-opacity-20 text-green-400 text-xs rounded-full">已发布</span>',
                rejected: '<span class="px-2 py-1 bg-red-500 bg-opacity-20 text-red-400 text-xs rounded-full">已拒绝</span>'
            }[item.status];

            card.innerHTML = `
                <div class="flex-1">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        ${statusBadge}
                        <span class="px-2 py-1 bg-primary bg-opacity-10 text-primary text-xs rounded-full">${item.category}</span>
                        <span class="text-xs text-gray-500">${item.user_id}</span>
                    </div>
                    <h4 class="font-bold text-lg">${item.song_name}</h4>
                    <p class="text-gray-400">${item.artist}</p>
                    <a href="${item.music_link}" target="_blank" class="text-primary text-sm hover:underline mt-1 inline-block">
                        <i class="fa fa-external-link mr-1"></i>试听链接
                    </a>
                    <p class="text-xs text-gray-600 mt-1">${new Date(item.created_at).toLocaleString('zh-CN')}</p>
                </div>
                <div class="flex gap-2 flex-shrink-0">
                    ${item.status !== 'approved' ? `<button onclick="updateMusicStatus(${item.id}, 'approved')" class="px-4 py-2 bg-green-500 bg-opacity-20 text-green-400 rounded-lg hover:bg-opacity-40 transition-all text-sm font-bold"><i class="fa fa-check mr-1"></i>发布</button>` : ''}
                    ${item.status !== 'rejected' ? `<button onclick="updateMusicStatus(${item.id}, 'rejected')" class="px-4 py-2 bg-red-500 bg-opacity-20 text-red-400 rounded-lg hover:bg-opacity-40 transition-all text-sm font-bold"><i class="fa fa-times mr-1"></i>拒绝</button>` : ''}
                    <button onclick="deleteMusicItem(${item.id})" class="px-4 py-2 bg-gray-700 text-gray-400 rounded-lg hover:bg-gray-600 transition-all text-sm"><i class="fa fa-trash"></i></button>
                </div>`;
            list.appendChild(card);
        });
    }

    async function updateMusicStatus(id, status) {
        const { error } = await db.from('music_submissions').update({ status }).eq('id', id);
        if (!error) loadMusicList(currentMusicFilter);
        else alert('操作失败：' + error.message);
    }

    async function deleteMusicItem(id) {
        if (!confirm('确认删除这条投稿？')) return;
        const { error } = await db.from('music_submissions').delete().eq('id', id);
        if (!error) loadMusicList(currentMusicFilter);
        else alert('删除失败：' + error.message);
    }

    // ===== 加载商品列表 =====
    async function loadAdminProducts() {
        const list = document.getElementById('products-admin-list');
        list.innerHTML = '<div class="text-center py-8 text-gray-400"><i class="fa fa-spinner fa-spin text-2xl"></i></div>';

        const { data, error } = await db.from('products').select('*').order('sort_order', { ascending: true });

        if (!data || data.length === 0) {
            list.innerHTML = '<div class="text-center py-8 text-gray-400">还没有商品，添加第一件吧！</div>';
            return;
        }

        list.innerHTML = '';
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'bg-dark-light rounded-xl p-5 border border-gray-800 flex flex-col md:flex-row md:items-center gap-4';
            card.innerHTML = `
                <div class="w-16 h-16 rounded-lg bg-dark-lighter flex-shrink-0 overflow-hidden">
                    ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center"><i class="fa fa-shopping-bag text-gray-600"></i></div>'}
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <h4 class="font-bold">${p.name}</h4>
                        ${p.is_active ? '<span class="px-2 py-0.5 bg-green-500 bg-opacity-20 text-green-400 text-xs rounded-full">上架</span>' : '<span class="px-2 py-0.5 bg-gray-700 text-gray-400 text-xs rounded-full">下架</span>'}
                        <span class="px-2 py-0.5 bg-dark-lighter text-gray-400 text-xs rounded-full">${p.shop_type === 'taobao' ? '淘宝' : p.shop_type === '1688' ? '1688' : '其他'}</span>
                    </div>
                    ${p.price ? `<p class="text-primary font-bold">¥${p.price}</p>` : ''}
                    ${p.description ? `<p class="text-gray-400 text-sm">${p.description}</p>` : ''}
                </div>
                <div class="flex gap-2 flex-shrink-0">
                    <button onclick="toggleProductStatus(${p.id}, ${p.is_active})"
                        class="px-4 py-2 ${p.is_active ? 'bg-yellow-500 bg-opacity-20 text-yellow-400' : 'bg-green-500 bg-opacity-20 text-green-400'} rounded-lg hover:bg-opacity-40 transition-all text-sm font-bold">
                        ${p.is_active ? '<i class="fa fa-eye-slash mr-1"></i>下架' : '<i class="fa fa-eye mr-1"></i>上架'}
                    </button>
                    <button onclick="deleteProduct(${p.id})" class="px-4 py-2 bg-red-500 bg-opacity-20 text-red-400 rounded-lg hover:bg-opacity-40 transition-all text-sm"><i class="fa fa-trash"></i></button>
                </div>`;
            list.appendChild(card);
        });
    }

    async function toggleProductStatus(id, current) {
        const { error } = await db.from('products').update({ is_active: !current }).eq('id', id);
        if (!error) loadAdminProducts();
        else alert('操作失败：' + error.message);
    }

    async function deleteProduct(id) {
        if (!confirm('确认删除此商品？')) return;
        const { error } = await db.from('products').delete().eq('id', id);
        if (!error) loadAdminProducts();
        else alert('删除失败：' + error.message);
    }

    // ===== 添加商品 =====
    document.getElementById('add-product-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('add-product-btn');
        const successEl = document.getElementById('product-add-success');
        const errorEl = document.getElementById('product-add-error');
        successEl.classList.add('hidden');
        errorEl.classList.add('hidden');

        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>添加中...';

        const price = document.getElementById('p-price').value;
        const { error } = await db.from('products').insert({
            name: document.getElementById('p-name').value.trim(),
            price: price ? parseFloat(price) : null,
            shop_link: document.getElementById('p-link').value.trim(),
            shop_type: document.getElementById('p-shop-type').value,
            image_url: document.getElementById('p-image').value.trim() || null,
            description: document.getElementById('p-desc').value.trim() || null,
            is_active: true
        });

        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-plus mr-2"></i>添加商品';

        if (error) {
            errorEl.textContent = '添加失败：' + error.message;
            errorEl.classList.remove('hidden');
        } else {
            successEl.classList.remove('hidden');
            this.reset();
            loadAdminProducts();
            setTimeout(() => successEl.classList.add('hidden'), 3000);
        }
    });
    </script>
</body>
</html>
